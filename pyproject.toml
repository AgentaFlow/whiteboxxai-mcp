[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboxxai-mcp"
version = "0.3.1"
description = "MCP (Model Context Protocol) server exposing WhiteBoxXAI observability/explainability capabilities to agentic AI clients"
readme = "README.md"
authors = [
    {name = "WhiteBoxXAI Team", email = "support@whiteboxxai.com"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "xai",
    "observability",
    "explainability",
    "agentic-ai",
]
requires-python = ">=3.11"
dependencies = [
    # <2.0.0: mcp 2.0.0 dropped/relocated mcp.server.fastmcp (the import this
    # server relies on), breaking on import. Cap until the server is migrated
    # to whatever 2.x's replacement API is.
    "mcp>=1.20.0,<2.0.0",
    "httpx>=0.25.0",
    # asgi.py (issue #226, Streamable HTTP transport) imports starlette
    # directly (JSONResponse, ASGI type aliases) rather than only relying on
    # it transitively through mcp -- no independent version pin beyond what
    # naturally resolves alongside mcp's own starlette>=0.27 floor.
    "starlette",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Resolved from PyPI.
    "whitebox-xai-sdk>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]
# Separate from `dev` (installed everywhere mcp_server is CI-tested) so
# lint/type/unit CI jobs don't have to pull in two heavy, example-only
# agent frameworks just to run mcp_server's own test suite (issue #227).
examples = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "semantic-kernel>=1.18.0",
]

[project.urls]
Homepage = "https://whiteboxxai.com"
Documentation = "https://docs.whiteboxxai.com/integrations/mcp"
Repository = "https://github.com/AgentaFlow/whiteboxxai-mcp"

[project.scripts]
whiteboxxai-mcp = "whiteboxxai_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whiteboxxai_mcp*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
# warn_return_any is off: whitebox-xai-sdk return values are untyped (Any) as seen
# from here, so it flags every tool that returns an SDK response unchanged.
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
