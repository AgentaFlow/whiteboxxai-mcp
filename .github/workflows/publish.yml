name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  MCP_PUBLISHER_VERSION: v1.8.1
  SMITHERY_CLI_VERSION: 1.2.0

jobs:
  build-and-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check release tag matches package version
      if: github.event_name == 'release'
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION=$(python -c "import re,pathlib; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
        if [ "$TAG" != "v$VERSION" ]; then
          echo "Release tag '$TAG' does not match pyproject.toml version 'v$VERSION'" >&2
          exit 1
        fi

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build distribution
      run: |
        python -m build

    - name: Check distribution
      run: |
        pip install twine
        twine check dist/*

    - name: Publish to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  mcp-registry:
    name: Publish to the MCP Registry
    needs: build-and-publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check server.json against the release
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python scripts/check_server_json.py --offline
        VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
        if [ "$TAG" != "v$VERSION" ]; then
          echo "Release tag '$TAG' does not match server.json version 'v$VERSION'" >&2
          exit 1
        fi

    - name: Wait for the release to appear on PyPI
      run: |
        VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
        for i in $(seq 1 30); do
          if curl --fail --silent --output /dev/null "https://pypi.org/pypi/whiteboxxai-mcp/${VERSION}/json"; then
            echo "whiteboxxai-mcp ${VERSION} is on PyPI"
            exit 0
          fi
          echo "Waiting for whiteboxxai-mcp ${VERSION} on PyPI (attempt ${i}/30)..."
          sleep 20
        done
        echo "whiteboxxai-mcp ${VERSION} never appeared on PyPI" >&2
        exit 1

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download and verify mcp-publisher
      run: |
        set -euo pipefail
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
        archive="mcp-publisher_${os}_${arch}.tar.gz"
        base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

        curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
        curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
        cosign verify-blob \
          --bundle "$archive.sigstore.json" \
          --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "$archive"
        tar xzf "$archive" mcp-publisher
        rm -f "$archive" "$archive.sigstore.json"

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    - name: Publish server to MCP Registry
      run: ./mcp-publisher publish

  smithery:
    name: Publish to Smithery
    needs: build-and-publish
    # Opt-in: set the repository variable SMITHERY_PUBLISH=true (and the
    # SMITHERY_API_KEY secret in the `pypi` environment) once the hosted /mcp/
    # endpoint accepts the header declared in smithery/config-schema.json.
    if: github.event_name == 'release' && vars.SMITHERY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Publish hosted endpoint to Smithery
      env:
        SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
      run: |
        npx --yes "smithery@${SMITHERY_CLI_VERSION}" mcp publish \
          "https://api.whiteboxxai.com/mcp/" \
          -n agentaflow/whiteboxxai-mcp \
          --config-schema smithery/config-schema.json
